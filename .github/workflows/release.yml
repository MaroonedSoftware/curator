name: Release

# Every commit on main gets a result of its own, its build seeds the task cache that pull requests
# restore from, and its image is published: pushed as `maroonedsoftware/curator:<sha>` beside the
# build, then `latest` moved onto it once the tests have passed.
#
# A push is also a RELEASE when the version in `apps/api/package.json` has no `v*` tag yet, which is
# true of exactly one commit per version: the merge of the version pull request that `versions`
# below opens from the pending changesets. That run also publishes the `X.Y.Z` and `X.Y` image tags,
# then the `vX.Y.Z` git tag and the GitHub release, in that order and after the tests. Nothing
# listens for a tag: the tag is a consequence of the merge, so a release can never name a commit
# nobody tested.
on:
    push:
        branches: [main]
    # A rebuild and republish of main on demand, say for a base image's security fix.
    workflow_dispatch:

# One release at a time, and never cancelled: a run interrupted between the image tags and the git
# tag leaves the registry holding half a release with nothing saying so.
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    # The version this push RELEASES, or the empty string for an ordinary push, which is most of them.
    # Between releases main carries the last release's number, so the version alone is not enough:
    # the tag is the record that it went out. A run whose tests fail cuts no tag, so the next push at
    # that version is the release instead. Asked of the API, and a failure to ask fails this job rather
    # than being read as "not released". Only on main: a manual run can be pointed at any branch.
    version:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            value: ${{ steps.read.outputs.value }}
            line: ${{ steps.read.outputs.line }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false
                  sparse-checkout: apps/api/package.json
                  sparse-checkout-cone-mode: false

            - name: Read the manifest and ask whether it is released
              id: read
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  version="$(jq -r .version apps/api/package.json)"
                  if [ -z "$version" ] || [ "$version" = null ]; then
                      echo "::error::apps/api/package.json has no version."
                      exit 1
                  fi
                  refs="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v${version}" --jq '.[].ref')"
                  if [ "${GITHUB_REF}" != refs/heads/main ]; then
                      echo "Not main, so not a release."
                      version=""
                  elif printf '%s\n' "$refs" | grep -qx "refs/tags/v${version}"; then
                      echo "v${version} is already released, so this is an ordinary push."
                      version=""
                  else
                      echo "v${version} has no tag, so this push releases it."
                  fi
                  echo "value=${version}" >> "$GITHUB_OUTPUT"
                  echo "line=${version%.*}" >> "$GITHUB_OUTPUT"

    build:
        uses: ./.github/workflows/build.yml

    # Deliberately not `needs: [build]`, so the image builds beside the tests rather than behind them.
    # What has to wait for the tests is the tags people pull by name, not the image, so this publishes
    # the commit tag alone and `promote` moves the rest.
    images:
        needs: [version]
        uses: ./.github/workflows/images.yml
        with:
            push: true
            version: ${{ needs.version.outputs.value }}
        secrets: inherit

    # A registry-side retag, so it takes seconds.
    promote:
        needs: [version, build, images]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            # Keep in step with `env.IMAGE` in images.yml.
            IMAGE: maroonedsoftware/curator
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Log in to Docker Hub
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            # `latest`, then the version and the release line on a release run. Why a tag never moves
            # backwards is in the script.
            - name: Move the tags onto this commit, unless they name a newer one
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ needs.version.outputs.value }}
                  LINE: ${{ needs.version.outputs.line }}
              run: .github/scripts/promote.sh

    # The git tag and the GitHub release, last, so they exist only once the image does.
    publish:
        needs: [version, promote]
        if: needs.version.outputs.value != ''
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            # The notes are the changelog entry `changeset version` wrote from the changesets the
            # version pull request consumed. A version with no entry fails here rather than
            # publishing an empty release.
            - name: Take the notes out of the changelog
              env:
                  VERSION: ${{ needs.version.outputs.value }}
              run: |
                  set -euo pipefail
                  awk -v v="## ${VERSION}" '
                      $0 == v { found = 1; next }
                      found && /^## / { exit }
                      found { print }
                  ' apps/api/CHANGELOG.md > notes.md
                  if [ ! -s notes.md ]; then
                      echo "::error::apps/api/CHANGELOG.md has no entry for ${VERSION}. Add one, and the next push to main releases it."
                      exit 1
                  fi
                  cat notes.md

            # The tag first, and the release on it with `--verify-tag`, so the release can only name
            # the tag this step made on this commit. A tag this step made is deleted again if the
            # release cannot be created, because `version` reads "there is a tag" as "this went out"
            # and a tag with no release would stop every later push from retrying. A release that
            # already exists is success, so re-running a run that got this far stays green.
            - name: Tag it, then publish it
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ needs.version.outputs.value }}
              run: |
                  set -euo pipefail
                  tag="v${VERSION}"

                  if gh release view "$tag" > /dev/null 2>&1; then
                      echo "${tag} is already released."
                      exit 0
                  fi

                  existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${tag}" --jq ".[] | select(.ref == \"refs/tags/${tag}\") | .object.sha")"
                  made=false
                  if [ -z "$existing" ]; then
                      gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${tag}" -f sha="${GITHUB_SHA}" > /dev/null
                      made=true
                  elif [ "$existing" != "$GITHUB_SHA" ]; then
                      echo "::error::${tag} already points at ${existing}, not ${GITHUB_SHA}, and has no release. Delete the tag if nothing shipped from it, and the next push to main releases ${VERSION}."
                      exit 1
                  fi

                  if ! gh release create "$tag" --verify-tag --title "curator ${VERSION}" --notes-file notes.md; then
                      if [ "$made" = true ]; then
                          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" ||
                              echo "::error::Could not delete ${tag} after the release failed. Delete it by hand, or no later push will retry ${VERSION}."
                      fi
                      exit 1
                  fi

    # The version pull request. Every push to main that carries a changeset opens it, or rebuilds it
    # from main's tip if it is open; merging it is the release, because its merge is the first commit
    # on main whose manifest names a version with no tag, which is what `version` above looks for.
    #
    # Behind the build, so a commit that failed its tests is not offered as a release.
    #
    # Opened with the workflow token, and GitHub starts no workflow for an event that token caused, so
    # NO CHECKS RUN ON IT. That is safe because nothing on the branch is new (version fields, changelog
    # entries, deleted changesets), and the merge runs every check on main before `publish` tags
    # anything. Edit an entry in its changeset on main, never on the branch: the branch is rewritten
    # from main on every push.
    #
    # Only for main's head, asked right before the push: a run for an older commit would rebuild the
    # branch from the past.
    #
    # Needs one repository setting, which a file cannot carry: Settings, Actions, General, "Allow
    # GitHub Actions to create and approve pull requests". Without it `gh pr create` is refused.
    versions:
        needs: [build]
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Look for changesets
              id: pending
              run: |
                  if find .changeset -maxdepth 1 -name '*.md' ! -iname README.md | grep -q .; then
                      echo "any=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "No changesets pending."
                      echo "any=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Install pnpm
              if: steps.pending.outputs.any == 'true'
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node
              if: steps.pending.outputs.any == 'true'
              uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: pnpm

            - name: Install dependencies
              if: steps.pending.outputs.any == 'true'
              run: pnpm install --frozen-lockfile

            - name: Version
              if: steps.pending.outputs.any == 'true'
              run: |
                  set -euo pipefail
                  pnpm changeset version
                  # changeset writes its changelogs unformatted.
                  pnpm exec prettier --write '**/CHANGELOG.md'
                  version="$(jq -r .version apps/api/package.json)"
                  {
                      echo "Merging this releases curator ${version}: the image tags \`${version}\` and \`${version%.*}\`, the \`v${version}\` tag and a GitHub release, once main's checks pass."
                      echo
                      awk -v v="## ${version}" '$0 == v { found = 1; next } found && /^## / { exit } found { print }' apps/api/CHANGELOG.md
                  } > "$RUNNER_TEMP/versions.md"

            # The token reaches git here and nowhere earlier, through gh's credential helper and only
            # for the push.
            - name: Open or update the pull request
              if: steps.pending.outputs.any == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
                  if [ "$head" != "$GITHUB_SHA" ]; then
                      echo "::notice::main has moved on to ${head}, so the version pull request is left to the run for it."
                      exit 0
                  fi
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  gh auth setup-git
                  git checkout -B changeset-release/main
                  git add -A
                  git commit -m 'Version packages'
                  git push --force origin changeset-release/main
                  if [ "$(gh pr list --head changeset-release/main --base main --state open --json number --jq length)" != 0 ]; then
                      gh pr edit changeset-release/main --title 'Version packages' --body-file "$RUNNER_TEMP/versions.md"
                  else
                      gh pr create --base main --head changeset-release/main --title 'Version packages' --body-file "$RUNNER_TEMP/versions.md"
                  fi
