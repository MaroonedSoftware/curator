name: Images

# The Docker image, called by `pr.yml` to prove it builds and by `release.yml` to publish it. Only
# the commit tag is ever pushed here; the tags people pull by name are moved onto it afterwards by
# `promote` in release.yml, once the tests have passed.
on:
    workflow_call:
        inputs:
            push:
                description: Publish the image, rather than only proving it builds.
                type: boolean
                default: false
            version:
                description: >-
                    The release this image is, without a leading v, stamped inside it. Empty on every
                    run that is not a release, which is most of them: an ordinary push builds nothing
                    claiming to be one.
                type: string
                default: ''

permissions:
    contents: read

env:
    # Written out again in release.yml rather than passed there as an output: the registry username
    # is a secret and a substring of this, so Actions would mask the output to an empty string.
    IMAGE: maroonedsoftware/curator

jobs:
    image:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            # No teardown: the builder goes with the runner.
            - name: Set up Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
              with:
                  cleanup: false

            # Asked before the build, so a publishing run with no credentials says the one useful
            # sentence instead of failing somewhere in Docker's error vocabulary. It fails rather
            # than warns: a warning would let a run build, publish nothing, and go green. Only on a
            # run that means to publish, since a pull request is never given them.
            - name: Check for registry credentials
              if: inputs.push
              env:
                  USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
              run: |
                  if [ -z "$USERNAME" ]; then
                      echo "::error::No registry credentials. Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in the repository's Actions secrets."
                      exit 1
                  fi

            - name: Log in to Docker Hub
              if: inputs.push
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build${{ inputs.push && ' and push' || '' }}
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  push: ${{ inputs.push }}
                  # A run that does not publish exports nothing: the image is built into the
                  # builder's cache and thrown away with the runner.
                  outputs: ${{ !inputs.push && 'type=cacheonly' || '' }}
                  platforms: linux/amd64
                  # Inside the image, so a running container can say what it is (`/api/health`)
                  # without anybody knowing which tag it was pulled from.
                  build-args: |
                      REVISION=${{ github.sha }}
                      VERSION=${{ inputs.version }}
                  tags: ${{ env.IMAGE }}:${{ github.sha }}
                  # The cache lives in the registry beside the image rather than in the Actions
                  # cache, which the turbo cache in build.yml already spends. Only a run that can
                  # log in writes it; a pull request reads what the last push to main left.
                  cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
                  cache-to: ${{ inputs.push && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}
