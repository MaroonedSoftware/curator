name: Build

# The whole check, called by `pr.yml` and `main.yml`. Two jobs side by side: `build` compiles,
# lints and type-checks, `test` runs the suites against a throwaway Postgres.
on:
    workflow_call:

# The build reads the repo and nothing else.
permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # Don't leave the token in .git/config for the install and build steps.
                  persist-credentials: false

            # pnpm comes from this action rather than corepack: Node 25 and later no longer ship a
            # corepack binary. The version still comes from the repo's `packageManager`.
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: pnpm

            # Turbo files each task's result under a hash of its inputs, so a restored cache replays
            # every package this commit did not touch. The key carries the commit so every run saves
            # a fresh entry, and the prefix restore-key is what actually hits: an exact key never
            # matches a commit that has not been built before.
            #
            # THIS JOB IS THE ONLY WRITER. `test` restores the same cache read-only.
            - name: Restore the task cache
              uses: actions/cache@v6
              with:
                  path: .turbo/cache
                  key: turbo-${{ runner.os }}-${{ github.sha }}
                  restore-keys: turbo-${{ runner.os }}-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # From the root and with no `--ignore-path`: Prettier then reads both `.gitignore` and
            # `.prettierignore`, so it never walks `.turbo/cache`. A warning, not a gate.
            - name: Check formatting
              run: pnpm format:check || echo "::warning title=Formatting::Prettier found unformatted files (listed in this step's log). Run pnpm format to fix them."

            # `lint:check`, never `lint`: that one is `eslint --fix`.
            - name: Lint
              run: pnpm lint:check

            - name: Build
              run: pnpm build

            # `pnpm build` compiles what ships, and each build tsconfig leaves `tests/` out. This is
            # the other half: vitest transpiles without checking types, so without it a test could
            # stop compiling against the code it covers and stay green.
            - name: Type-check the tests and scripts
              run: pnpm typecheck

            # Every run saves what it restored plus what it added, so prune results nothing will
            # ask for again. A step, so it lands before the cache action's post step writes the entry.
            - name: Age out stale task results
              if: always()
              run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true

    test:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        # The `db-test` service from docker-compose.yml, on the same port and credentials, so the
        # defaults in `apps/api/tests/test.db.ts` find it without any TEST_DATABASE_* overrides. The
        # suite's global setup migrates a template database in it, and each test file clones its own.
        services:
            postgres:
                image: postgres:17
                ports:
                    - 14133:5432
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres-test
                    POSTGRES_DB: curator-test
                options: >-
                    --health-cmd "pg_isready -U postgres -d curator-test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: pnpm

            # Read-only, and deliberately not `needs: build`: waiting for the compile would put it
            # back on the clock. Anything this commit changed is rebuilt here in parallel instead.
            - name: Restore the task cache
              uses: actions/cache/restore@v6
              with:
                  path: .turbo/cache
                  key: turbo-${{ runner.os }}-${{ github.sha }}
                  restore-keys: turbo-${{ runner.os }}-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # The tests import their workspace dependencies through each package's exports, which
            # point at `dist`, so the workspace is built first.
            - name: Build
              run: pnpm build

            - name: Test
              run: pnpm test
