# Local development defaults. Committed: nothing here is a secret.
# Per-machine overrides go in the gitignored appconfig.local.yaml. Any string may be ${env:NAME}.

server:
    port: 14100
    # Browser origins allowed by CORS, comma-separated.
    corsOrigins: http://localhost:14102

# Postgres from docker-compose.yml (`pnpm db:up` at the repo root).
database:
    host: localhost
    port: 14132
    user: postgres
    password: postgres
    name: curator

# TVs live in the database: add them in the web app (TVs page) or with POST /tvs.
# frame:
#     clientName: Curator            # shown on a TV's pairing prompt
#     debug: false                   # log every frame on the wire, for every TV
#     originalsDir: .data/originals  # uploaded images, kept per TV; relative to apps/api

# A TV set to rotate through an album gets its next piece once its interval is up.
# rotation:
#     tickSeconds: 60     # how often to look for a TV whose next piece is due
#     retrySeconds: 300   # how long to leave a TV that failed to advance (off, say)
